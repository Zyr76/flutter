name: Build Release APK

on:
  workflow_dispatch:
  push:
    branches: [ androlua ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Accept Android SDK licenses
        run: |
          SDK="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK" --licenses > /dev/null 2>&1 || true
          # 装插件可能用到的 CMake 3.22.1（jni 等原生插件硬编码此版本）
          "$SDK" "cmake;3.22.1" "platforms;android-36" "build-tools;35.0.0" > /dev/null 2>&1 || true

      - name: Install CMake 4.1.2 into Android SDK
        # 项目的 CMakeLists 要求 >= 4.1.2，而 sdkmanager 只提供到 3.31.x，故手动放入 SDK
        run: |
          set -euo pipefail
          CM="$ANDROID_HOME/cmake/4.1.2"
          curl -fsSL -o /tmp/cmake.tar.gz \
            https://github.com/Kitware/CMake/releases/download/v4.1.2/cmake-4.1.2-linux-x86_64.tar.gz
          sudo mkdir -p "$CM"
          sudo tar -xzf /tmp/cmake.tar.gz -C "$CM" --strip-components=1
          sudo chown -R "$(id -u):$(id -g)" "$CM"
          "$CM/bin/cmake" --version

      # release 使用仓库内固定的 app/keystore/release.p12 签名，
      # 不再需要每次生成 debug keystore（那会导致每次构建签名不同、无法覆盖安装）。
      - name: Flutter pub get
        working-directory: flutter_bridge
        run: flutter pub get

      # 静态分析：只报告不阻断（历史问题较多，先让它可见，再逐步清零）
      - name: Flutter analyze (非阻断)
        working-directory: flutter_bridge
        continue-on-error: true
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Build Flutter AAR (release / AOT)
        working-directory: flutter_bridge
        run: flutter build aar --release --no-debug --no-profile --target-platform android-arm64

      - name: Build AndroLua release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: androlua-flutter-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
