plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    namespace = "com.privatespace.private_space"
    compileSdk = 37
    ndkVersion = flutter.ndkVersion

    // 只打包 64 位（arm64-v8a）原生库：abiFilters 只对 NDK 构建生效，
    // 依赖插件自带的 .so（flutter 引擎等）需用 packaging 显式过滤，
    // 否则 APK 会同时打进 armeabi-v7a / x86_64，体积暴增。
    packagingOptions {
        jniLibs {
            excludes += [
                'lib/armeabi-v7a/**',
                'lib/x86/**',
                'lib/x86_64/**',
            ]
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.privatespace.private_space"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdkVersion = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName

        // 仅打包 64 位库，减小体积并覆盖主流机型
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            // 内存受限环境：关闭混淆/压缩，避免 R8 触发 OOM；仍用 debug 签名便于直接安装
            signingConfig = signingConfigs.debug
            minifyEnabled = false
            shrinkResources = false
        }
    }
}

flutter {
    source = "../.."
}
